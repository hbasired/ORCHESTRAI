# Stage 27 — SPIRE server config (local dev; trust domain ai-agent.local; join-token node attestation).
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "ai-agent.local"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data { keys_path = "/opt/spire/data/keys.json" }
    }
}
